name: NANG Whitelist Update

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        type: choice
        options:
          - add
          - remove
      user_id:
        description: "Roblox UserId"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-whitelist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update whitelist
        env:
          ACTION: ${{ inputs.action }}
          USER_ID: ${{ inputs.user_id }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          path = "whitelist.json"
          action = os.environ["ACTION"]
          raw = os.environ["USER_ID"].strip()

          if not raw.isdigit():
              raise SystemExit("UserId harus angka.")

          uid = int(raw)
          data = json.load(open(path, "r", encoding="utf-8"))
          users = sorted(set(int(x) for x in data.get("users", [])))

          if action == "add":
              if uid not in users:
                  users.append(uid)
                  users.sort()
          elif action == "remove":
              users = [x for x in users if x != uid]
          else:
              raise SystemExit("Action tidak valid.")

          data["version"] = int(data.get("version", 0)) + 1
          data["users"] = users

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

      - name: Commit whitelist
        run: |
          git config user.name "NANG Whitelist Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whitelist.json
          git diff --cached --quiet && exit 0
          git commit -m "NANG whitelist: ${{ inputs.action }} ${{ inputs.user_id }}"
          git push
